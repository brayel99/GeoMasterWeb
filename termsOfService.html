<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms of Service</title>
    <link rel="icon" href="assets/AppIcon.appiconset/Icon1024.png" type="image/x-icon"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }
        header {
            background-color: #444;
            color: white;
            padding: 1rem 0;
            text-align: center;
            position: relative;
        }
        header img {
            width: 100px; /* Adjust as needed */
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .container {
            width: 80%;
            margin: 2rem auto;
            padding: 2rem;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2, h3 {
            color: #444;
        }
        p {
            margin-bottom: 1rem;
        }
        footer {
            background-color: #444;
            color: white;
            text-align: center;
            padding: 1rem 0;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
         <img src="assets/AppIcon.appiconset/Icon1024.png" alt="Geomaster Logo">
        <h1>Terms of Service</h1>
    </header>

    <div class="container" id="terms-container">
        <h2>Loading...</h2>
    </div>

    <footer>
        <p>&copy; 2024 GeoMaster. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('TermsOfServices.json')
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('terms-container');
                    container.innerHTML = ''; // Clear the loading text

                    // Intro
                    let intro = document.createElement('p');
                    intro.textContent = data.Intro;
                    container.appendChild(intro);

                    // Applicable terms and policies
                    createSection(container, "Applicable terms and policies", data["Applicable terms and policies"]);
                    
                    // Your account
                    createSection(container, "Your account", data["Your account"]);

                    // Your content
                    createSection(container, "Your content", data["Your content"]);

                    // Our proprietary rights
                    createSection(container, "Our proprietary rights", data["Our proprietary rights"]);

                    // Restrictions
                    createSection(container, "Restrictions", data["Restrictions"]);

                    // THIRD PARTY WEBSITE AND CONTENT
                    createSection(container, "THIRD PARTY WEBSITE AND CONTENT", data["THIRD PARTY WEBSITE AND CONTENT"]);

                    // The subscription contract between you and us
                    createSection(container, "The subscription contract between you and us", data["The subscription contract between you and us"]);

                    // Indemnification; Hold Harmless
                    createSection(container, "Indemnification; Hold Harmless", data["Indemnification; Hold Harmless"]);

                    // Disclaimer of Warranties
                    createSection(container, "Disclaimer of Warranties", data["Disclaimer of Warranties"]);

                    // Limitation of Liability; Waiver
                    createSection(container, "Limitation of Liability; Waiver", data["Limitation of Liability; Waiver"]);

                    // Notice and Procedure for Making Claims of Copyright Infringement
                    createSection(container, "Notice and Procedure for Making Claims of Copyright Infringement", data["Notice and Procedure for Making Claims of Copyright Infringement"], true);

                    // Miscellaneous
                    createSection(container, "Miscellaneous", data["Miscellaneous"]);
                })
                .catch(error => {
                    console.error('Error fetching terms:', error);
                    const container = document.getElementById('terms-container');
                    container.innerHTML = '<p>Failed to load terms of service. Please try again later.</p>';
                });

            function createSection(container, title, content, isNested = false) {
                let sectionTitle = document.createElement('h2');
                sectionTitle.textContent = title;
                container.appendChild(sectionTitle);

                if (typeof content === 'object' && !Array.isArray(content)) {
                    for (const [key, value] of Object.entries(content)) {
                        let subSectionTitle = document.createElement(isNested ? 'h4' : 'h3');
                        subSectionTitle.textContent = key;
                        container.appendChild(subSectionTitle);

                        if (typeof value === 'string') {
                            let text = document.createElement('p');
                            text.textContent = value;
                            container.appendChild(text);
                        } else if (Array.isArray(value)) {
                            let list = document.createElement('ul');
                            value.forEach(item => {
                                let listItem = document.createElement('li');
                                listItem.textContent = item;
                                list.appendChild(listItem);
                            });
                            container.appendChild(list);
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
